name: Continuous deployment

on:
  workflow_run:
    workflows:
      - Continuous integration
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check release notes
        env:
          DJANGO_SETTINGS_MODULE: home_sweet_home.settings.production
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          SECRET_KEY: build-only-not-a-production-secret
          ALLOWED_HOSTS: .run.app
          CSRF_TRUSTED_ORIGINS: https://example.com
        run: python manage.py check_release_notes

      - name: Collect production static files
        env:
          DJANGO_SETTINGS_MODULE: home_sweet_home.settings.production
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          SECRET_KEY: build-only-not-a-production-secret
          ALLOWED_HOSTS: .run.app
          CSRF_TRUSTED_ORIGINS: https://example.com
        run: python manage.py collectstatic --noinput

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Apply database migrations
        env:
          DJANGO_SETTINGS_MODULE: home_sweet_home.settings.production
          SECRET_KEY: migration-only-not-a-production-secret
          ALLOWED_HOSTS: .run.app
          CSRF_TRUSTED_ORIGINS: https://example.com
        run: |
          DATABASE_URL="$(gcloud secrets versions access latest --secret=home-sweet-home-database-url-unpooled)"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          python manage.py migrate --noinput

      - name: Deploy Cloud Run function
        id: deploy
        uses: google-github-actions/deploy-cloud-functions@v4
        timeout-minutes: 15
        with:
          name: ${{ vars.GCP_FUNCTION_NAME }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          environment: GEN_2
          runtime: python313
          entry_point: home_sweet_home
          source_dir: .
          service_account: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          build_service_account: projects/${{ vars.GCP_PROJECT_ID }}/serviceAccounts/${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
          memory: 512Mi
          min_instance_count: 0
          max_instance_count: 2
          max_instance_request_concurrency: 1
          service_timeout: 60s
          environment_variables: |-
            DJANGO_SETTINGS_MODULE=home_sweet_home.settings.production
            ALLOWED_HOSTS=.run.app,${{ vars.GCP_REGION }}-${{ vars.GCP_PROJECT_ID }}.cloudfunctions.net
            CSRF_TRUSTED_ORIGINS=https://${{ vars.GCP_REGION }}-${{ vars.GCP_PROJECT_ID }}.cloudfunctions.net
            SECURE_SSL_REDIRECT=True
            TIME_ZONE=Europe/Amsterdam
            AI_ASSISTANT_ENABLED=True
            OPENAI_COMMAND_MODEL=gpt-5-mini
            OPENAI_TRANSCRIPTION_MODEL=gpt-4o-mini-transcribe
            AI_COMMAND_TIMEOUT_SECONDS=20
            AI_COMMAND_PROPOSAL_TTL_SECONDS=600
            AI_AUDIO_MAX_SECONDS=20
            AI_AUDIO_MAX_BYTES=5242880
            AI_COMMANDS_PER_MINUTE=10
            PUSH_NOTIFICATIONS_ENABLED=True
            VAPID_PUBLIC_KEY=${{ vars.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY_PATH=/secrets/vapid/private_key.pem
            VAPID_SUBJECT=${{ vars.VAPID_SUBJECT }}
            GOOGLE_OAUTH_ENABLED=True
            GOOGLE_CALENDAR_ENABLED=True
            GOOGLE_CALENDAR_EVENT_DURATION_MINUTES=30
            PASSWORD_LOGIN_ENABLED=True
          secrets: |-
            DATABASE_URL=projects/${{ vars.GCP_PROJECT_ID }}/secrets/home-sweet-home-database-url/versions/latest
            SECRET_KEY=projects/${{ vars.GCP_PROJECT_ID }}/secrets/home-sweet-home-django-secret-key/versions/latest
            OPENAI_API_KEY=projects/${{ vars.GCP_PROJECT_ID }}/secrets/home-sweet-home-openai-api-key/versions/latest
            /secrets/vapid/private_key.pem=projects/${{ vars.GCP_PROJECT_ID }}/secrets/home-sweet-home-vapid-private-key/versions/1
            GOOGLE_OAUTH_CLIENT_ID=projects/${{ vars.GCP_PROJECT_ID }}/secrets/home-sweet-home-google-oauth-client-id/versions/latest
            GOOGLE_OAUTH_CLIENT_SECRET=projects/${{ vars.GCP_PROJECT_ID }}/secrets/home-sweet-home-google-oauth-client-secret/versions/latest
            GOOGLE_OAUTH_REDIRECT_URI=projects/${{ vars.GCP_PROJECT_ID }}/secrets/home-sweet-home-google-oauth-redirect-uri/versions/latest
            GOOGLE_ALLOWED_EMAILS=projects/${{ vars.GCP_PROJECT_ID }}/secrets/home-sweet-home-google-allowed-emails/versions/latest
            GOOGLE_LEGACY_USER_MAP=projects/${{ vars.GCP_PROJECT_ID }}/secrets/home-sweet-home-google-legacy-user-map/versions/latest
            GOOGLE_TOKEN_ENCRYPTION_KEY=projects/${{ vars.GCP_PROJECT_ID }}/secrets/home-sweet-home-google-token-encryption-key/versions/latest

      - name: Announce the deployed version
        env:
          DJANGO_SETTINGS_MODULE: home_sweet_home.settings.production
          SECRET_KEY: release-announcement-only-not-a-production-secret
          ALLOWED_HOSTS: .run.app
          CSRF_TRUSTED_ORIGINS: https://example.com
          PUSH_NOTIFICATIONS_ENABLED: "True"
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          RELEASE_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          DATABASE_URL="$(gcloud secrets versions access latest --secret=home-sweet-home-database-url-unpooled)"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          VAPID_PRIVATE_KEY_PATH="$(mktemp "$RUNNER_TEMP/vapid-private-key.XXXXXX")"
          export VAPID_PRIVATE_KEY_PATH
          trap 'rm -f "$VAPID_PRIVATE_KEY_PATH"' EXIT
          gcloud secrets versions access 1 --secret=home-sweet-home-vapid-private-key > "$VAPID_PRIVATE_KEY_PATH"
          chmod 600 "$VAPID_PRIVATE_KEY_PATH"
          python manage.py announce_release --release-id "$RELEASE_ID"

      - name: Add deployment URL to the job summary
        env:
          GCP_FUNCTION_NAME: ${{ vars.GCP_FUNCTION_NAME }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          APP_URL="$(gcloud functions describe "$GCP_FUNCTION_NAME" --v2 --region "$GCP_REGION" --format='value(serviceConfig.uri)')"
          echo "### Deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "$APP_URL" >> "$GITHUB_STEP_SUMMARY"
