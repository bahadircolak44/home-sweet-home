<article class="chore-task-row">
    <form
        method="post"
        action="{% url 'chores:task_toggle' task_id=task.pk %}"
        class="chore-task-row__check-form"
        hx-post="{% url 'chores:task_toggle' task_id=task.pk %}"
        hx-target="#session-live-region"
        hx-swap="outerHTML"
        hx-disabled-elt="button"
    >
        {% csrf_token %}
        <button class="item-row__check-button" type="submit" aria-label="Mark {{ task.title }} as done">
            <span class="check-control" aria-hidden="true"></span>
        </button>
    </form>
    <div class="chore-task-row__content">
        <span class="chore-task-row__title">{{ task.title }}</span>
        <span class="item-row__meta">
            Added by {{ task.created_by.get_full_name|default:task.created_by.get_username }}{% if task.due_date %} · Due {{ task.due_date|date:"M j" }}{% endif %}
        </span>
    </div>
    <div class="chore-task-row__actions">
        <a class="item-edit-link" href="{% url 'chores:task_edit' task_id=task.pk %}">Edit</a>
        <form
            method="post"
            action="{% url 'chores:task_delete' task_id=task.pk %}"
            hx-post="{% url 'chores:task_delete' task_id=task.pk %}"
            hx-target="#session-live-region"
            hx-swap="outerHTML"
            hx-confirm="Delete {{ task.title }}?"
            hx-disabled-elt="button"
        >
            {% csrf_token %}
            <button class="icon-button icon-button--danger" type="submit" aria-label="Delete {{ task.title }}">×</button>
        </form>
    </div>
</article>
